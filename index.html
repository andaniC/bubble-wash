<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Splash Wash">
  <meta name="theme-color" content="#4f8fd8">
  <title>Splash Wash</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #14283a;
      --blue: #2a6fe8;
      --panel: rgba(255, 255, 255, 0.82);
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #cfe4f4;
      font-family: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { position: fixed; inset: 0; }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    button {
      font: inherit;
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .panel {
      background: var(--panel);
      box-shadow: 0 2px 10px rgba(20, 40, 58, 0.15);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    #mute {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: 48px;
      height: 48px;
      border-radius: 50%;
      color: var(--ink);
      display: grid;
      place-items: center;
    }
    #mute svg { width: 24px; height: 24px; }
    #mute .slash { display: none; }
    #mute.off .wave { display: none; }
    #mute.off .slash { display: inline; }

    #hud {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: calc(max(14px, env(safe-area-inset-right)) + 60px);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    #hud.on { opacity: 1; }
    #hud .panel {
      height: 48px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      font-weight: 800;
      font-size: 17px;
      white-space: nowrap;
    }
    #job { flex: 1; min-width: 0; max-width: 460px; }
    #item-label { overflow: hidden; text-overflow: ellipsis; }
    #meter {
      flex: 1;
      min-width: 60px;
      height: 12px;
      border-radius: 6px;
      background: rgba(20, 40, 58, 0.12);
      overflow: hidden;
    }
    #meter-fill {
      height: 100%;
      background: linear-gradient(90deg, #39b6ff, var(--blue));
      transform-origin: left;
      transform: scaleX(0);
      transition: transform 0.15s linear;
    }
    #percent { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
    #slots { display: flex; gap: 6px; }
    #slots i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px rgba(20, 40, 58, 0.25);
      transition: background 0.3s, box-shadow 0.3s;
    }
    #slots i.filled { background: var(--blue); box-shadow: none; }

    #card {
      position: fixed;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%) scale(0.92);
      padding: 22px 34px;
      border-radius: 26px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    #card.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #card b { display: block; font-size: 22px; font-weight: 800; opacity: 0.7; }
    #card span { display: block; font-size: 40px; font-weight: 900; letter-spacing: -0.01em; }

    #fade {
      position: fixed;
      inset: 0;
      background: #f4f8fb;
      opacity: 0;
      pointer-events: none;
    }

    #title {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      padding: 24px 16px max(30px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, rgba(10, 24, 38, 0) 35%, rgba(10, 24, 38, 0.6) 100%);
      transition: opacity 0.45s ease, visibility 0.45s;
    }
    #title.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(44px, 9vw, 76px);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      text-shadow: 0 3px 18px rgba(10, 24, 38, 0.45);
    }
    #play {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: var(--blue);
      display: grid;
      place-items: center;
      box-shadow: 0 10px 26px rgba(10, 40, 100, 0.4);
      transition: transform 0.15s ease;
    }
    #play:active { transform: scale(0.94); }
    #play svg { width: 52px; height: 52px; margin-left: 8px; }
    #levels {
      display: flex;
      gap: 10px;
      max-width: min(100%, 640px);
      overflow-x: auto;
      padding: 6px 4px 8px;
      scrollbar-width: none;
      touch-action: pan-x;
    }
    #levels::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      color: var(--ink);
      font-weight: 800;
      font-size: 17px;
    }
    .chip.done { background: var(--blue); color: #fff; }
    .chip.current { box-shadow: 0 0 0 3px #fff; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="panel"><span id="level-label">Level 1</span><span id="slots"><i></i><i></i><i></i></span></div>
    <div class="panel" id="job">
      <span id="item-label"></span>
      <div id="meter"><div id="meter-fill"></div></div>
      <span id="percent">0%</span>
    </div>
  </div>

  <button id="mute" class="panel" aria-label="Sound on or off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/>
      <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
      <path class="slash" d="m16 9 6 6m0-6-6 6"/>
    </svg>
  </button>

  <div id="card" class="panel"><b>Level 1</b><span>All clean!</span></div>

  <div id="title">
    <h1>Splash Wash</h1>
    <button id="play" aria-label="Play">
      <svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" fill="#fff"/></svg>
    </button>
    <div id="levels" aria-label="Pick a level"></div>
  </div>

  <div id="fade"></div>
</body>
</html>
