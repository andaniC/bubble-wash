<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Splash Wash">
  <meta name="theme-color" content="#14181f">
  <title>Splash Wash</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Everything is sized in game pixels: --u is one game pixel on screen. */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #14181f;
      color: #fff;
      font-family: 'Pixelify Sans', ui-monospace, monospace;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { position: fixed; inset: 0; }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    .hidden { display: none !important; }

    #stage {
      --u: 3px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background: #000;
      font-size: calc(var(--u) * 8);
    }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    .chip {
      background: rgba(18, 22, 30, 0.78);
      border-radius: calc(var(--u) * 4);
      box-shadow: inset 0 calc(var(--u) * -1) 0 rgba(0, 0, 0, 0.4);
    }

    #mute {
      position: absolute;
      top: calc(var(--u) * 4);
      right: calc(var(--u) * 4);
      width: calc(var(--u) * 18);
      height: calc(var(--u) * 18);
      display: grid;
      place-items: center;
      z-index: 20;
      padding: 0;
    }
    #mute svg { width: calc(var(--u) * 11); height: calc(var(--u) * 11); }
    #mute .slash { display: none; }
    #mute.off .wave { display: none; }
    #mute.off .slash { display: inline; }

    #hud {
      position: absolute;
      top: calc(var(--u) * 4);
      left: calc(var(--u) * 4);
      right: calc(var(--u) * 26);
      display: flex;
      gap: calc(var(--u) * 4);
      align-items: center;
      z-index: 10;
    }
    #home {
      width: calc(var(--u) * 18);
      height: calc(var(--u) * 18);
      display: grid;
      place-items: center;
      padding: 0;
      flex: none;
    }
    #home i, #home i::before, #home i::after {
      display: block;
      width: calc(var(--u) * 9);
      height: calc(var(--u) * 2);
      background: #fff;
      position: relative;
    }
    #home i::before, #home i::after { content: ''; position: absolute; left: 0; }
    #home i::before { top: calc(var(--u) * -3); }
    #home i::after { top: calc(var(--u) * 3); }
    #job {
      flex: 1;
      min-width: 0;
      height: calc(var(--u) * 18);
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 5);
      padding: 0 calc(var(--u) * 6);
    }
    #job-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
    #bar {
      flex: 1;
      height: calc(var(--u) * 6);
      background: rgba(255, 255, 255, 0.18);
      border-radius: calc(var(--u) * 3);
      overflow: hidden;
    }
    #bar-fill { height: 100%; background: #5fd36a; transform-origin: left; transform: scaleX(0); transition: transform 0.12s linear; }
    #pct { min-width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }

    #tools {
      position: absolute;
      left: calc(var(--u) * 4);
      bottom: calc(var(--u) * 4);
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 3);
      z-index: 10;
    }
    .tool {
      width: calc(var(--u) * 24);
      height: calc(var(--u) * 24);
      padding: 0;
      display: grid;
      place-items: center;
      background: rgba(18, 22, 30, 0.78);
      border: calc(var(--u) * 1) solid rgba(255, 255, 255, 0.18);
      border-radius: calc(var(--u) * 4);
    }
    .tool canvas { width: calc(var(--u) * 16); height: calc(var(--u) * 16); }
    .tool.on { background: #f2c21b; border-color: #fff; }

    #parts {
      position: absolute;
      right: calc(var(--u) * 4);
      top: calc(var(--u) * 26);
      padding: calc(var(--u) * 3) calc(var(--u) * 5);
      font-size: calc(var(--u) * 7);
      max-width: calc(var(--u) * 96);
      z-index: 10;
    }
    #parts-head { padding: 0; background: none; font-weight: 600; }
    #parts-head::after { content: ' ▾'; }
    #parts.open #parts-head::after { content: ' ▴'; }
    #parts-list { display: none; margin-top: calc(var(--u) * 2); line-height: 1.35; }
    #parts.open #parts-list { display: block; }
    #parts-list .ok { color: #7ee08a; }

    #toast {
      position: absolute;
      left: 50%;
      top: calc(var(--u) * 28);
      transform: translateX(-50%);
      padding: calc(var(--u) * 3) calc(var(--u) * 7);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 30;
    }
    #toast.on { opacity: 1; }

    #hint {
      position: absolute;
      left: 50%;
      bottom: calc(var(--u) * 16);
      transform: translateX(-50%);
      padding: calc(var(--u) * 4) calc(var(--u) * 8);
      pointer-events: none;
      z-index: 10;
      animation: bob 1s ease-in-out infinite alternate;
    }
    @keyframes bob { to { transform: translate(-50%, calc(var(--u) * -3)); } }

    #result {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(8, 12, 18, 0.55);
      z-index: 40;
    }
    #result .box {
      background: #1f2733;
      border: calc(var(--u) * 2) solid #fff;
      border-radius: calc(var(--u) * 6);
      padding: calc(var(--u) * 10) calc(var(--u) * 16);
      text-align: center;
      min-width: calc(var(--u) * 150);
    }
    #result h2 { margin: 0; font-size: calc(var(--u) * 18); color: #f2c21b; }
    #result p { margin: calc(var(--u) * 4) 0 0; }
    #result-pay { font-size: calc(var(--u) * 16); color: #7ee08a; font-weight: 700; }
    .btns { display: flex; gap: calc(var(--u) * 6); justify-content: center; margin-top: calc(var(--u) * 10); }
    .btn {
      background: #2a6fe8;
      border-radius: calc(var(--u) * 4);
      padding: calc(var(--u) * 4) calc(var(--u) * 10);
      box-shadow: inset 0 calc(var(--u) * -2) 0 rgba(0, 0, 0, 0.3);
      font-weight: 600;
    }
    .btn.alt { background: #3a4554; }

    .page {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      background: #1a3f86 linear-gradient(#2a6fe8, #13306a);
      z-index: 15;
    }
    .page header {
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 6);
      padding: calc(var(--u) * 6) calc(var(--u) * 26) calc(var(--u) * 4) calc(var(--u) * 8);
    }
    .page h1 {
      margin: 0;
      flex: 1;
      font-size: calc(var(--u) * 18);
      line-height: 1;
      letter-spacing: calc(var(--u) * 0.5);
      text-shadow: calc(var(--u) * 1) calc(var(--u) * 1) 0 #0d2047;
    }
    .money { padding: calc(var(--u) * 3) calc(var(--u) * 7); color: #f2c21b; font-weight: 700; }
    #grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: calc(var(--u) * 5);
      padding: calc(var(--u) * 2) calc(var(--u) * 8) calc(var(--u) * 10);
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 1);
      padding: calc(var(--u) * 3);
      background: #10203f;
      border-radius: calc(var(--u) * 5);
      text-align: left;
      box-shadow: inset 0 calc(var(--u) * -2) 0 rgba(0, 0, 0, 0.35);
    }
    .thumb { aspect-ratio: 4 / 3; border-radius: calc(var(--u) * 3); overflow: hidden; background: #0b1630; }
    .thumb canvas { width: 100%; height: 100%; display: block; image-rendering: auto; }
    .card b { font-size: calc(var(--u) * 7.5); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card span { font-size: calc(var(--u) * 6.5); color: #f2c21b; }
    .card.done span { color: #7ee08a; }
    .card.locked .thumb canvas { filter: grayscale(1) brightness(0.4); }
    .card.locked b, .card.locked span { color: #8a93a3; }

    #shop-list { display: flex; flex-direction: column; gap: calc(var(--u) * 4); padding: calc(var(--u) * 2) calc(var(--u) * 8) calc(var(--u) * 10); }
    .item {
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 6);
      padding: calc(var(--u) * 4) calc(var(--u) * 6);
      background: #10203f;
      border-radius: calc(var(--u) * 5);
    }
    .item .icon { width: calc(var(--u) * 24); height: calc(var(--u) * 24); flex: none; }
    .item div { flex: 1; display: flex; flex-direction: column; gap: calc(var(--u) * 1); }
    .item b { font-weight: 600; }
    .item span { font-size: calc(var(--u) * 6.5); color: #b9c4d6; }
    .buy { background: #3fa04a; border-radius: calc(var(--u) * 4); padding: calc(var(--u) * 3) calc(var(--u) * 7); font-weight: 700; min-width: calc(var(--u) * 40); }
    .buy:disabled { background: #3a4554; color: #9aa6b8; cursor: default; }
    #close-shop { padding: calc(var(--u) * 3) calc(var(--u) * 8); }
  </style>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="view" width="320" height="240"></canvas>

    <div id="hud" class="hidden">
      <button id="home" class="chip" aria-label="Back to jobs"><i></i></button>
      <div id="job" class="chip"><span id="job-name"></span><div id="bar"><div id="bar-fill"></div></div><span id="pct">0%</span></div>
    </div>
    <div id="tools" class="hidden"></div>
    <div id="parts" class="chip hidden"><button id="parts-head">Parts</button><div id="parts-list"></div></div>
    <div id="hint" class="chip hidden">Hold your finger on the mud to blast it</div>

    <div id="board" class="page scroll">
      <header>
        <h1>SPLASH WASH</h1>
        <span class="money chip">$0</span>
        <button id="open-shop" class="btn">Shop</button>
      </header>
      <div id="grid"></div>
    </div>

    <div id="shop" class="page scroll hidden">
      <header>
        <button id="close-shop" class="btn alt">◂ Jobs</button>
        <h1>SHOP</h1>
        <span class="money chip">$0</span>
      </header>
      <div id="shop-list"></div>
    </div>

    <div id="result" class="hidden">
      <div class="box">
        <h2>JOB DONE!</h2>
        <p id="result-name"></p>
        <p id="result-pay"></p>
        <p id="result-time"></p>
        <div class="btns">
          <button id="result-board" class="btn alt">Jobs</button>
          <button id="result-next" class="btn">Next job ▸</button>
        </div>
      </div>
    </div>

    <div id="toast" class="chip"></div>

    <button id="mute" class="chip" aria-label="Sound on or off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square">
        <path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/>
        <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
        <path class="slash" d="m16 9 6 6m0-6-6 6"/>
      </svg>
    </button>
  </div>
</body>
</html>
